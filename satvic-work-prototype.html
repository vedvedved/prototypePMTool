<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace · Satvic Team Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#F5F2EB;--white:#fff;--teal:#6E9A90;--teal-brand:#91B7AF;--ink:#3E5C54;--body:#7A7566;--muted:#9B9486;--line:#E3DED2;--line2:#EFEBE2;
    --amber:#DFB35C;--amber-tint:#FAEBC8;--amber-ink:#7D5A12;--green:#7FA35A;--green-tint:#EEF3E1;--green-tint2:#E5EDCB;--green-ink:#4C5C22;--rose-tint:#F5E6DC;--rose-ink:#8A5433;--red:#D4826A;--coral:#D85A30;
    --grey-tint:#F0EEE9;--grey-ink:#6B665B;--teal-tint:#E8F0ED;--teal-tint2:#D6E7E1;--blue-tint:#DEE6EC;--blue-ink:#3B5468;--pink-tint:#FBDDE6;--pink-ink:#96324F;--sun:#F8F1EC}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#F1EDE4;font-family:'Outfit',system-ui,sans-serif;color:var(--body);font-size:14px;line-height:1.45}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
  .topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;background:var(--white);border-bottom:0.5px solid var(--line)}
  .logo{display:flex;align-items:center;gap:8px;color:#5A7A72;font-weight:500;font-size:13px;line-height:1.15}
  .logo svg{width:22px;height:22px}
  .navlinks{display:flex;gap:20px;font-size:14px}
  .navlinks a{color:var(--body);text-decoration:none;padding-bottom:3px;cursor:pointer}
  .navlinks a.on{color:var(--ink);font-weight:500;border-bottom:1.5px solid var(--teal-brand)}
  .badge{display:inline-block;background:var(--coral);color:#fff;font-size:10px;font-weight:500;border-radius:9px;min-width:17px;text-align:center;padding:1px 5px;margin-left:5px;vertical-align:top}
  .badge.soft{background:var(--amber);color:#fff}
  .badge:empty{display:none}
  .page{padding:18px 32px 60px;max-width:1280px;margin:0 auto}
  .ph{margin-bottom:12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .ph .strip{margin:0;flex:1;min-width:280px}
  .ph h1{font-size:24px;font-weight:500;color:var(--ink)}
  .seg{display:flex;background:#EDE8DD;border-radius:8px;padding:3px}
  .seg button{border:none;background:transparent;padding:5px 11px;font-size:12px;color:var(--body);border-radius:6px}
  .seg button.on{background:var(--white);color:var(--ink);font-weight:500}
  .card{background:var(--white);border:0.5px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .ct{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .lnk{font-size:12.5px;color:var(--teal);font-weight:500;background:none;border:none;padding:0;cursor:pointer}
  .lnk:hover{text-decoration:underline}
  .pill{font-size:11px;font-weight:500;padding:3px 9px;border-radius:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .p-ok{background:var(--green-tint2);color:var(--green-ink)}.p-wait{background:var(--amber-tint);color:var(--amber-ink)}.p-miss{background:var(--rose-tint);color:var(--rose-ink)}.p-grey{background:var(--grey-tint);color:var(--grey-ink)}.p-blue{background:var(--blue-tint);color:var(--blue-ink)}.p-pink{background:var(--pink-tint);color:var(--pink-ink)}
  .av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#fff;flex-shrink:0;overflow:hidden;background-size:cover !important;background-position:center !important;background-repeat:no-repeat !important}
  .av.sm{width:24px;height:24px;font-size:8px}.av.lg{width:52px;height:52px;font-size:15px}
  .pri{background:var(--teal);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:500;white-space:nowrap}
  .pri:hover{background:#5F8B81}.pri:disabled{background:#C9DDD6;cursor:not-allowed}
  .secb{background:var(--white);color:var(--body);border:0.5px solid var(--line);border-radius:7px;padding:8px 14px;font-size:13px;white-space:nowrap}
  .secb:hover{background:#FAF8F3}
  .smb{padding:5px 10px;font-size:12px}
  .hidden{display:none !important}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 6px 20px rgba(62,92,84,.25);max-width:90vw;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{font-size:13px;color:var(--muted);padding:10px 0}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .hint{font-size:11.5px;color:var(--muted);margin-top:3px}
  .inp{width:100%;background:var(--white);border:0.5px solid #D8D3C8;border-radius:7px;padding:8px 10px;height:38px}
  .inp:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
  textarea.inp{height:auto;min-height:60px;resize:vertical}
  .lb{font-size:12px;font-weight:500;color:#5C5344;margin-bottom:4px;display:block}
  .fg{margin-bottom:12px}
  .prog{display:flex;align-items:center;gap:8px}
  .pbar{flex:1;height:8px;background:#EDE8DD;border-radius:4px;overflow:hidden}
  .pfill{height:100%;border-radius:4px;transition:width .3s}
  .g{background:var(--green)}.y{background:var(--amber)}.r{background:var(--red)}
  .ppct{font-size:12px;font-weight:500;color:var(--ink);min-width:36px;text-align:right}
  .mini{display:flex;gap:5px}
  .mini select{height:32px;font-size:12.5px;border:0.5px solid #D8D3C8;border-radius:6px;padding:0 6px;background:#fff}

  /* syncs strip (one box) */
  .strip{background:var(--white);border:0.5px solid var(--line);border-radius:10px;margin-bottom:12px}
  .striph{padding:10px 14px;display:flex;align-items:center;gap:14px;cursor:pointer;flex-wrap:wrap}
  .striph b{font-weight:500;color:var(--ink);font-size:13px}
  .striph .st{font-size:12.5px;display:flex;align-items:center;gap:5px}
  .striph .st i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .striph .chev{margin-left:auto;color:var(--muted);width:14px;height:14px;transition:transform .15s}
  .strip.open .chev{transform:rotate(180deg)}
  .stripb{border-top:0.5px solid var(--line2);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  @media (max-width:860px){.stripb{grid-template-columns:1fr}}
  .col h3{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:flex;justify-content:space-between}
  .col h3.miss{color:var(--rose-ink)}.col h3.done{color:var(--green-ink)}
  .srow{display:grid;grid-template-columns:18px 56px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--line2)}
  .srow:last-child{border-bottom:none}
  .srow .grip{color:#C9C3B6;cursor:grab;font-size:14px;text-align:center}
  .srow.dragging{opacity:.4}
  .srow.over{box-shadow:inset 0 2px 0 var(--teal)}
  .srow .avs{margin:0;justify-content:flex-start}
  .srow .nm{font-size:13px;font-weight:500;color:var(--ink)}
  .srow .mt{font-size:11.5px;color:var(--muted)}
  .srow .acts{display:flex;gap:4px}
  .ico{width:26px;height:26px;border-radius:6px;border:none;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .ico:hover{background:#FAF8F3;color:var(--ink)}
  .ico svg{width:14px;height:14px}
  .ico.tickb{border:1.5px solid #C9C3B6;border-radius:50%;width:22px;height:22px}
  .ico.tickb:hover{background:var(--teal);border-color:var(--teal);color:#fff}
  .ico.tickb svg{width:11px;height:11px}

  /* people bar */
  .topbar{background:var(--white);border:0.5px solid var(--line);border-radius:10px;padding:10px 6px;margin-bottom:14px;display:flex;overflow-x:auto;align-items:flex-start}
  .tb-g{display:flex;flex-direction:column;gap:3px;padding:0 12px;border-right:0.5px solid var(--line2);min-width:max-content}
  .tb-teams{display:flex;gap:10px;align-items:flex-start}
  .tb-t{display:flex;flex-direction:column;gap:2px}
  .tb-tl{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding-left:4px}
  .tb-g:last-child{border-right:none}
  .tb-gl{font-size:10.5px;font-weight:500;color:var(--ink);white-space:nowrap}
  .tb-row{display:flex;gap:4px}
  .tb-p{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 5px 5px;border-radius:8px;cursor:pointer;width:64px}
  .tb-p:hover{background:#FAF8F3}.tb-p.on{background:var(--teal-tint)}
  .tb-p .av{width:40px;height:40px}
  .tb-p span.nm{font-size:10.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}
  .sp{font-size:9px;font-weight:500;border-radius:8px;padding:1px 5px;white-space:nowrap;display:inline-flex;align-items:center;gap:2px;height:15px}
  .sp.done{background:var(--green-tint2);color:var(--green-ink)}
  .sp.due{background:transparent;color:var(--amber-ink);border:1px solid var(--amber)}
  .sp.miss{background:var(--rose-tint);color:var(--rose-ink)}
  .sp.skip{background:var(--grey-tint);color:var(--grey-ink)}
  .sp.none{visibility:hidden}
  .tb-tools{display:flex;flex-direction:column;gap:6px;padding:4px 12px;justify-content:center;align-self:center}
  .split{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
  @media (max-width:900px){.split{grid-template-columns:1fr}}
  .tree{background:var(--white);border:0.5px solid var(--line);border-radius:10px;padding:8px 6px 6px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
  .grp{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:500;color:var(--ink);padding:10px 10px 4px;cursor:pointer;user-select:none}
  .grp svg{width:12px;height:12px;color:var(--muted);transition:transform .15s}
  .grp.closed svg{transform:rotate(-90deg)}
  .tm{font-size:10.5px;color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.4px}
  .pr{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--body)}
  .pr:hover{background:#FAF8F3}.pr.on{background:var(--teal-tint);color:var(--ink);font-weight:500}
  .pr .av{width:24px;height:24px;font-size:8px}
  .treefoot{border-top:0.5px solid var(--line2);margin-top:6px;padding:8px 8px 2px;display:flex;justify-content:space-between;align-items:center}

  /* person header with tabs inside */
  .phead{background:none;border:none;border-radius:0;padding:6px 0 0;margin-bottom:12px}
  .phead .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .phead h2{font-size:20px;font-weight:500;color:var(--ink)}
  .phead .sub{font-size:12.5px;color:var(--muted)}
  .phead .prog{min-width:240px;margin-left:auto}
  .rhythm{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:12px}
  .rc{background:var(--white);border:0.5px solid #D8D3C8;border-radius:9px;padding:10px 12px;box-shadow:0 1px 2px rgba(62,92,84,.06)}
  .rc .l{font-size:10.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
  .rc .l .lnk{font-size:11px}
  .sync{padding:6px 0;border-top:0.5px solid var(--line2)}
  .sync:first-of-type{border-top:none;padding-top:0}
  .sync .nm{font-size:13px;font-weight:500;color:var(--ink)}
  .sync .with{font-size:11.5px;color:var(--muted)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-top:4px}
  .kv span:nth-child(odd){color:var(--muted)}
  .kv span:nth-child(even){color:var(--ink);font-weight:500}
  .kv .due,.kv span.due,.kv span:nth-child(even) .due{color:var(--rose-ink)}
  .rc .kv{font-size:12px}
  .rc .sync .nm{font-size:13px}
  .rc .sync .mt{font-size:11.5px}
  .sync .acts{display:flex;gap:6px;margin-top:6px;align-items:center}
  .sline{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:0.5px solid var(--line2)}
  .sline:first-of-type{border-top:none;padding-top:0}
  .sline .nm{font-size:13px;font-weight:500;color:var(--ink)}
  .sline .mt{font-size:11.5px;color:var(--muted)}
  .sline .mt b{color:var(--ink);font-weight:500}
  .mline{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:0.5px solid var(--line2);font-size:12px;color:var(--ink)}
  .mline:first-of-type{border-top:none;padding-top:0}
  .mline .w{font-size:11px;color:var(--muted)}
  .leave{background:var(--amber-tint);border:0.5px solid #E9CE87;border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--amber-ink);margin-top:12px;display:flex;align-items:center;gap:8px}
  .leave svg{width:14px;height:14px}
  .ptabs{display:flex;gap:18px;margin-top:12px;border-top:0.5px solid var(--line2)}
  .ptabs button{background:none;border:none;padding:11px 2px 10px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-0.5px}
  .ptabs button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--teal-brand)}

  /* board */
  .scopeline{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;color:var(--body);flex-wrap:wrap}
  .scopeline b{color:var(--ink);font-weight:500}
  .scopeline .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .proj{background:none;border:none;border-radius:0;padding:0;margin-bottom:28px;scroll-margin-top:16px}
  .proj+.proj{border-top:0.5px solid var(--line);padding-top:30px}
  .proj.misc{background:none}
  .proj.upc{background:none}
  .proj.dropok{outline:2px dashed #A8CBC1;outline-offset:8px;border-radius:8px}
  .pjh{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:0;border-bottom:none}
  .pjh .pjm{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pjh .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .pjt{font-size:17px;font-weight:500;color:var(--ink);border:1px solid transparent;border-radius:5px;padding:2px 6px;margin-left:-6px;min-width:60px}
  .pjt:hover{border-color:var(--line)}.pjt:focus{outline:2px solid var(--teal);border-color:transparent}
  .ptype{font-size:10.5px;font-weight:400;padding:2px 9px;border-radius:10px;background:none;color:var(--muted);border:0.5px solid var(--line);cursor:pointer}
  .ptype:hover{background:var(--teal-tint2);color:#2F4A43}
  .pjm{margin-left:auto;display:flex;gap:4px}
  .lists{display:flex;gap:18px;overflow-x:auto;padding:4px 0 6px;align-items:flex-start;margin-top:6px}
  .list{background:none;border-radius:8px;padding:0;min-width:236px;flex:1 1 236px;max-width:380px;transition:background .12s}
  .list.over{background:var(--teal-tint);outline:1px dashed #A8CBC1;outline-offset:4px}
  .list.ldrag{opacity:.4}
  .lh{display:flex;align-items:center;gap:4px;margin-bottom:10px;cursor:grab;padding-bottom:6px;border-bottom:0.5px solid var(--line)}
  .lt{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border:1px solid transparent;border-radius:4px;padding:2px 5px;flex:1;min-width:0;background:transparent}
  .lt:hover{border-color:var(--line)}.lt:focus{outline:2px solid var(--teal);border-color:transparent;background:#fff}
  .lc{font-size:11px;color:var(--muted)}
  .tcard{background:var(--white);border:0.5px solid #D8D3C8;border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:grab;position:relative;box-shadow:0 1px 2px rgba(62,92,84,.06)}
  .tcard:hover{border-color:#A8CBC1}
  .tcard.dragging{opacity:.35}
  .tcard.done{background:var(--green-tint);border-color:#C9D6AE}
  .tcard.burst::after{content:'✦ ✦ ✦';position:absolute;top:-10px;right:14px;color:var(--amber);font-size:12px;animation:burst .9s ease-out forwards;pointer-events:none}
  @keyframes burst{0%{opacity:0;transform:translateY(6px) scale(.6)}30%{opacity:1;transform:translateY(-2px) scale(1.15)}100%{opacity:0;transform:translateY(-14px) scale(1)}}
  .labels{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
  .lab{font-size:10px;font-weight:500;color:#fff;padding:2px 8px;border-radius:9px;line-height:1.3;display:inline-flex;align-items:center;cursor:pointer}
  .tct{font-size:13px;color:var(--ink);line-height:1.35;border:1px solid transparent;border-radius:4px;padding:1px 3px;margin:-1px 44px -1px -3px}
  .tct:hover{border-color:var(--line)}.tct:focus{outline:2px solid var(--teal);border-color:transparent;background:#fff}
  .tl{display:flex;align-items:center;margin-top:8px;cursor:pointer}
  .pt{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
  .pt::before,.pt::after{content:'';position:absolute;top:50%;height:1.5px;background:#D6E7E1;width:50%}
  .pt::before{left:0}.pt::after{right:0}
  .pt.first::before,.pt.last::after{display:none}
  .pt.lp::after{background:var(--teal)}.pt.rp::before{background:var(--teal)}
  .pt i{position:relative;z-index:1;background:#fff;border:1.5px solid var(--teal)}
  .pt i.f{background:var(--teal)}
  .pt i.g{background:var(--green);border-color:var(--green)}
  .pt i.a{background:var(--amber);border-color:var(--amber)}
  .pt i.r{background:var(--red);border-color:var(--red)}
  .pt i.now{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
  .pt i[data-mstick],.pt i[data-cptick]{cursor:pointer}
  .tll span{flex:1;text-align:center;white-space:normal;max-width:none;font-size:9.5px}
  .tll span.red{color:var(--rose-ink);font-weight:500}
  .tll span.gr{color:var(--green-ink)}
  .tll span.am{color:var(--amber-ink)}
  .tctw{display:block;padding-right:56px}
  .tl2{display:grid;gap:4px;margin-top:10px}
  .pt2{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;min-width:0;padding:0 2px}
  .pt2::before,.pt2::after{content:'';position:absolute;top:7px;height:1.5px;background:#D6E7E1;width:50%}
  .pt2::before{left:0}.pt2::after{right:0}
  .pt2.first::before,.pt2.last::after{display:none}
  .pt2.lp::after{background:var(--teal)}.pt2.rp::before{background:var(--teal)}
  .pt2 i{width:15px;height:15px;border-radius:50%;background:#fff;border:1.5px solid var(--teal);position:relative;z-index:1;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .pt2 i svg{width:9px;height:9px}
  .pt2 i{color:#C9C3B6;border-color:#C9C3B6}
  .pt2 i.tk:hover{border-color:var(--teal);background:var(--teal-tint)}
  .pt2 i.tk:hover:not(.g)::after{content:'✓';font-size:9px;color:var(--teal);font-weight:600}
  .pt2 i.r{border-color:var(--red)}
  .pt2 i.r:hover{border-color:var(--red);background:#FBEFEF}
  .pt2 i.r.tk:hover::after{color:var(--red)}
  .pt2 i.b{width:9px;height:9px;background:#C9C3B6;border-color:#C9C3B6}
  .pt2 i.g{background:#5FA85C;border-color:#5FA85C;color:#fff}
  .pt2 i.g:hover{background:#5FA85C;border-color:#5FA85C;color:#fff}
  .pt2 i.now{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
  .pt2 i.tk{cursor:pointer}
  .pt2 .pn{font-size:10.5px;color:var(--ink);font-weight:500;margin-top:5px;line-height:1.25;white-space:normal}
  .pt2 .pd{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.25}

  .bar .btk svg{width:8px;height:8px;color:#fff;display:none}
  .bar .btk.on{background:#fff}.bar .btk.on svg{display:block;color:var(--teal)}
  .bar{padding-right:22px;position:relative}
  /* edit teams two pane */
  .et{display:grid;grid-template-columns:240px 1fr;height:min(72vh,640px);border:0.5px solid var(--line);border-radius:10px;overflow:hidden}
  .etl{background:#FAF8F3;border-right:0.5px solid var(--line);padding:10px;overflow:auto}
  .etr{overflow:auto}
  .mbg{align-items:center}
  .rc .kv{align-items:center}
  .etl h5{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:500;margin:0 0 6px}
  .gnode{font-size:12.5px;font-weight:500;color:var(--ink);padding:6px 6px;display:flex;align-items:center;gap:6px;border-radius:6px;cursor:pointer}
  .gnode:hover,.tnode:hover{background:#F3EFE4}
  .gnode .gp,.tnode .gp{color:#C9C3B6;font-size:12px;cursor:grab}
  .tnode{font-size:12px;color:#5C5344;padding:5px 6px 5px 22px;display:flex;align-items:center;gap:6px;border-radius:6px;cursor:pointer}
  .tnode.on,.gnode.on{background:var(--teal-tint);color:var(--ink);font-weight:500}
  .tnode .n{margin-left:auto;font-size:10px;color:var(--muted);font-weight:400}
  .etadd{font-size:11px;color:var(--teal);padding:4px 6px 4px 22px;cursor:pointer;font-weight:500}
  .etadd:hover{text-decoration:underline}
  .etr{padding:16px 18px}
  .etr h4{font-size:16px;font-weight:500;color:var(--ink);margin:0;border:1px solid transparent;border-radius:5px;padding:2px 6px;margin-left:-6px;display:inline-block;min-width:80px}
  .etr h4:hover{border-color:var(--line)}.etr h4:focus{outline:2px solid var(--teal);border-color:transparent}
  .etr .sub{font-size:11.5px;color:var(--muted);margin:2px 0 10px}
  .etr h5{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:500;margin:12px 0 6px}
  .faces{display:flex;gap:6px;flex-wrap:wrap}
  .face{display:flex;flex-direction:column;align-items:center;width:62px;padding:7px 2px 5px;border-radius:8px;border:0.5px solid var(--line);position:relative;cursor:pointer;background:#fff}
  .face:hover{border-color:#A8CBC1}
  .face.on{background:var(--teal-tint);border-color:#A8CBC1}
  .face .av{width:32px;height:32px;font-size:9px}
  .face span.fn{font-size:10px;color:var(--ink);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}
  .face b{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;background:var(--teal);color:#fff;font-size:10px;text-align:center;line-height:16px;font-weight:500;display:none}
  .face.on b{display:block}
  .etsearch{border:0.5px solid #D8D3C8;border-radius:7px;padding:7px 10px;font-size:12.5px;width:260px;margin:4px 0 8px}
  .divider{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted);margin:12px 0 6px}
  .divider::before,.divider::after{content:'';flex:1;height:0.5px;background:var(--line)}
  .etfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:0.5px solid var(--line2)}
  .dseg{display:flex;gap:16px;border-bottom:0.5px solid var(--line);margin-bottom:14px}
  .dseg button{background:none;border:none;padding:8px 2px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-0.5px}
  .dseg button.on{color:var(--ink);font-weight:500;border-bottom-color:var(--teal-brand)}
  .band.bandline{padding:8px 12px;display:flex;align-items:center;gap:10px}
  .listline{display:flex;gap:18px;align-items:center;padding:8px 2px 0}
  .tl2{align-items:start}
  .tl2{gap:0;align-items:stretch}
  .pt2{padding:4px 2px 6px;border-radius:8px}
  .pt2::before,.pt2::after{top:11px}
  .pt2.wk{background:var(--teal-tint)}
  .pt2.wk+.pt2.wk{border-top-left-radius:0;border-bottom-left-radius:0}
  .pt2.wk:has(+.pt2.wk){border-top-right-radius:0;border-bottom-right-radius:0}
  .dotrow{position:relative;display:flex;justify-content:center;width:100%;height:15px}
  .dotrow .cps{top:-3px;left:calc(50% + 11px)}
  .tcard .dotrow .cps{left:calc(50% + 9px)}
  .menu,.pop{z-index:400}
  .avs .more{width:20px;height:20px;border-radius:50%;background:#EDE8DD;color:#5C5344;font-size:8px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-left:-5px;border:1.5px solid #fff}
  .proj .pjh+.band{margin-top:6px}
  .scopeline{margin-bottom:14px}
  .bwrap{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;align-items:start}
  .rail{position:sticky;top:12px;border-right:0.5px solid var(--line);padding-right:16px}
  .rail .rh{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:2px 0 8px;font-weight:500}
  .rail .ri{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:13.5px;color:var(--body);cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:inherit}
  .rail .ri:hover{background:var(--teal-tint)}
  .rail .ri.on{background:var(--white);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(62,92,84,.08)}
  .rail .ri .d{width:8px;height:8px;border-radius:50%;flex:none}
  .rail .ri .nm{flex:1;min-width:0;line-height:1.25}
  .rail .ri{align-items:flex-start}.rail .ri .d{margin-top:5px}.rail .ri .n{margin-top:2px}
  .rail .ri .n{font-size:11px;color:var(--muted);white-space:nowrap}
  .rail .ri .n.m{color:var(--red)}
  .rail .wk{margin-top:16px;padding-top:14px;border-top:0.5px solid var(--line);font-size:13.5px;color:var(--ink)}
  .rail .wk .big{font-size:20px;font-weight:500;color:var(--ink);line-height:1.1;margin-top:2px}
  .rail .wk .big button{font-size:20px;font-weight:500;color:var(--ink);background:none;border:none;border-bottom:1px dotted var(--muted);padding:0;font-family:inherit;cursor:pointer}
  .rail .wk .pbar{height:10px;margin-top:8px;border-radius:5px}
  .rail .wk .pfill{border-radius:5px}
  .rail .foot{margin-top:14px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .rail .foot .lnk{font-size:12px}
  @media(max-width:860px){.bwrap{grid-template-columns:1fr}.rail{position:static;border-right:none;border-bottom:0.5px solid var(--line);padding:0 0 10px}}
  .whobtn.picking{border:1.5px solid var(--ink)}
  .trow.sel.on{background:var(--teal-tint)}
  .lsec.pickmode{margin:-14px -18px 0;padding:14px 18px 10px 15px;border-left:3px solid var(--teal);background:#F3F6F3;border-radius:0}
  .pickhead{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink);margin-bottom:8px}
  .pickhead b{font-weight:500}
  .chip.pk{background:var(--ink);border-color:var(--ink);color:#fff}
  .pop .faces{display:flex;gap:6px;flex-wrap:wrap}
  .pop .face{width:60px;padding:6px 2px 5px}
  .pop .face .av{width:30px;height:30px;font-size:9px}
  .pop .face .fn{font-size:9.5px}
  .prog .hint{margin:0}

  .tcard .pt2 .pd{display:none}
  .pjt{font-size:18px;color:#2F4A43}
  .lt{color:var(--ink);font-size:11.5px}
  .lh{border-bottom:0.5px solid #D8D3C8}
  .proj+.proj{border-top:0.5px solid #D8D3C8}
  .tct{color:#2F4A43}
  .tcard,.band{border-color:#D3CDC0}
  .rail{border-right:0.5px solid #D8D3C8}
  .rail .wk{border-top:0.5px solid #D8D3C8}
  .pjh .pjm .pri.smb{padding:4px 11px;font-size:12px}
  .pastwrap .proj.past .tcard,.pastwrap .proj.past .band{cursor:default}
  .pastwrap .proj.past .tcard *,.pastwrap .proj.past .band *{pointer-events:none}
  .pastwrap .proj.past .lh{cursor:default}
  .pastwrap .proj.past .addcard{display:none}

  .calh{padding:12px 16px;border-bottom:none}
  .calh b{font-size:16px}
  .legend{margin:0;padding:0 16px 10px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--body);border-bottom:0.5px solid var(--line2)}

  .legend i.lv{width:18px;height:8px;border-radius:3px}
  .calhd{background:none}
  .wkrow{min-height:112px;padding-bottom:8px;grid-auto-rows:min-content}
  .dcell .n .num{font-size:11.5px}
  .dcell.today .n .num{background:var(--teal);color:#fff;font-weight:600}
  .bar{font-size:10.5px;padding:2px 20px 2px 7px;margin:2px 3px 0;border-radius:4px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}

  .bar.ov{background-color:inherit;outline:none}

  .bar.done .tx{text-decoration:line-through}
  .bar.lv{padding:2px 7px;font-size:10.5px}
  .lns{display:flex;flex-direction:column;gap:1px;padding:2px 3px 0;min-width:0;position:relative;z-index:1}
  .ln{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink);padding:1px 4px;border-radius:4px;cursor:pointer;min-width:0;line-height:1.5}

  .ln .d{width:7px;height:7px;border-radius:50%;flex:none}

  .ln .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

  .ln .tk{margin-left:auto;width:14px;height:14px;border-radius:50%;border:1.5px solid #C9C3B6;display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
  .ln .tk svg{width:8px;height:8px;color:#fff;display:none}
  .ln .tk.on{background:var(--teal);border-color:var(--teal)}.ln .tk.on svg{display:block}
  .ln .tk:hover{border-color:var(--teal)}

  .rc{border-color:#CFC9BC;box-shadow:0 2px 6px rgba(62,92,84,.08)}

  .ptabs{margin-top:26px;border-top:none}
  .proj{margin-bottom:46px}

  .pjh{background:#E8E3D7;border-radius:9px;padding:9px 14px;margin-bottom:16px}

  .list{min-height:70px;position:relative;cursor:pointer}
  .addghost{display:none;border:1px dashed #B9C9C2;border-radius:8px;padding:8px;text-align:center;color:var(--teal);font-size:12px;margin-top:4px}

  .list:has(.addcard-inp) .addghost{display:none}
  .pill.p-miss{background:var(--red);color:#fff;font-weight:600}
  .pt2 i.r{border-color:var(--red);border-width:2px}
  .bar.done{opacity:1;background-color:#5FA85C !important}
  .bar.done .tx{text-decoration:none}
  .bar .ovd{flex:none;width:auto;height:14px;border-radius:7px;padding:0 6px;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--red);background:#fff;line-height:14px;white-space:nowrap}
  .ln .tk.on{background:#5FA85C;border-color:#5FA85C}
  .ln.done .tx{text-decoration:none;color:var(--ink)}
  .ln.done .d{background:#5FA85C !important}
  .legend{display:flex;gap:10px 28px;flex-wrap:wrap;padding:8px 16px 12px}
  .legend .lg{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .legend .lgh{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500;margin-right:2px}

  .trow.sel.w{position:relative}
</style>

(() => {
  const _n=new Date();const TODAY=new Date(_n.getFullYear(),_n.getMonth(),_n.getDate());
  const $=s=>document.querySelector(s);
  const pad=n=>String(n).padStart(2,'0');
  const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sept','Oct','Nov','Dec'];
  const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const DAB=['SUN','MON','TUE','WED','THURS','FRI','SAT'];
  const fmtT=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return `${h%12||12}${m?':'+pad(m):''}${h<12?'am':'pm'}`};
  const agoTxt=d=>{const n=daysBetween(d,TI);return n===0?'today':n===1?'yesterday':n+' days ago'};
  const inTxt=d=>{const n=daysBetween(TI,d);return n===0?'today':n===1?'tomorrow':'in '+n+' days'};
  const fmt=s=>s?`${parse(s).getDate()} ${MON[parse(s).getMonth()]}`:'';
  const fmtL=s=>s?`${DOW[parse(s).getDay()]}, ${parse(s).getDate()} ${MON[parse(s).getMonth()]}`:'';
  const fmtS=s=>s?`${DOW[parse(s).getDay()]} ${parse(s).getDate()}`:'';

    hcells.forEach(el=>{el.onmousedown=e=>{if(e.button!==0)return;hs=he=el.dataset.hour;hpaint()};el.onmouseenter=()=>{if(hs&&el.dataset.hour.split('|')[0]===hs.split('|')[0]){he=el.dataset.hour;hpaint()}};el.onmouseup=()=>{if(!hs)return;const [d,t1]=hs.split('|'),[,t2]=he.split('|');const a=t1<t2?t1:t2,b=t1<t2?t2:t1;hs=he=null;hcells.forEach(x=>x.classList.remove('selh'));const dur=Math.max(60,(Number(b.slice(0,2))-Number(a.slice(0,2))+1)*60);openEvent(k,d,a,null,dur)}});
    document.onmouseup=()=>{if(selStart){selStart=selEnd=null;cells.forEach(x=>x.classList.remove('sel'))}if(hs){hs=he=null;hcells.forEach(x=>x.classList.remove('selh'))}};
    // event blocks: click opens; drag to another day or hour moves (syncs move for this week only)
    c.querySelectorAll('[data-ev]').forEach(el=>{el.onclick=e=>{if(e.target.closest('.tk,.btk'))return;e.stopPropagation();const [kind,id]=el.dataset.ev.split('|');if(kind==='ev')openEvent(k,null,null,id);else{const s=SYNCS.find(x=>x.id===id);syncMenu(el,s)}};
      el.ondragstart=e=>{e.stopPropagation();e.dataTransfer.setData('text/ev',el.dataset.ev);el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging')});
    hcells.forEach(h=>{h.ondragover=e=>{if(e.dataTransfer.types.includes('text/ev')){e.preventDefault();h.classList.add('over')}};h.ondragleave=()=>h.classList.remove('over');h.ondrop=e=>{h.classList.remove('over');const d=e.dataTransfer.getData('text/ev');if(!d)return;e.preventDefault();const [kind,id]=d.split('|');const [nd,nt]=h.dataset.hour.split('|');moveEvent(kind,id,nd,nt)}});
    c.querySelectorAll('[data-taskdrop]').forEach(cell=>{cell.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('text/ev')||e.dataTransfer.types.includes('text/task'))e.preventDefault()});cell.addEventListener('drop',e=>{const ev=e.dataTransfer.getData('text/ev');const tk=e.dataTransfer.getData('text/task');const nd=cell.dataset.taskdrop;if(ev){const [kind,id]=ev.split('|');moveEvent(kind,id,nd,null);return}if(tk){const [id,from]=tk.split('|');const t=tasks.find(x=>x.id===Number(id));const shift=daysBetween(from,nd);if(!shift)return;if(t.start)t.start=addDays(t.start,shift);if(t.due)t.due=addDays(t.due,shift);t.ms.forEach(m=>{if(m.date)m.date=addDays(m.date,shift)});toast(`Moved to ${fmtL(nd)}.`);render()}})});

  // ---------- notes / progress ----------

    const past=EVENTS.filter(e=>e.cat==='meeting'&&e.d<=TI&&(e.with.includes(k)||e.by===k)).sort((a,b)=>b.d.localeCompare(a.d));

    const hhBlock=`<div class="card" data-notesec="hh"><div class="ct"><span>Honest hour</span><button class="lnk" data-addhn="${k}">+ Add notes</button></div>${hn.length?hn.map(n=>`<div class="notes"><div class="nd">${fmtL(n.d)}</div><div class="nt">${linkify(n.n)}</div></div>`).join(''):'<div class="empty">No notes yet.</div>'}</div>`;

  function progressHtml(k){

    if(tab==='teams'){
      M2.querySelectorAll('[data-gsel]').forEach(el=>el.onclick=()=>{etSel='g:'+el.dataset.gsel;etSearch='';openEditTeams('teams')});
      M2.querySelectorAll('[data-tsel]').forEach(el=>el.onclick=e=>{e.stopPropagation();etSel=el.dataset.tsel;etSearch='';openEditTeams('teams')});

  // ---------- feedback desk ----------

  const timeLeft=d=>{if(d.need==='none')return {h:'<span class="pill p-grey">No rush</span>',o:4,ov:false};const dueBy=addDays(d.at.slice(0,10),NEEDDAYS[d.need]);const left=daysBetween(TI,dueBy);

    const cols=`<colgroup><col style="width:22%"><col style="width:10%"><col style="width:13%"><col style="width:12%"><col style="width:20%"><col style="width:12%"><col style="width:11%"></colgroup>`;
    const newRow=d=>{const p=P[d.who];const st=timeLeft(d);return `<tr class="${d.run?'active':''} ${st.ov?'ovr':''}"><td class="wrap">${d.t}${d.msn?`<div class="hint" style="margin:0">${d.msn}</div>`:''}</td><td><span class="row" style="gap:6px">${avatar(d.who,'sm')}${p.f}</span></td><td style="color:var(--muted)">${fmtAt(d.at)}</td><td>${link(d)}</td><td class="wrap" style="color:var(--body)">${d.note?esc(d.note):'<span style="color:var(--muted)">—</span>'}</td><td>${st.h}<div class="hint" style="margin:2px 0 0">${NEED[d.need][0]}</div></td><td>${true?`<button class="doneb" data-done="${d.id}">${CHK.replace('<svg','<svg style="width:11px;height:11px"')} Mark done</button>${d.run?`<div class="hint" style="margin:3px 0 0;white-space:nowrap"><span class="timer" data-timer="${d.id}">${took(d.sec)}</span> · <button class="lnk" data-pause="${d.id}" style="font-size:11px">Not now</button></div>`:d.sec?`<div class="hint" style="margin:3px 0 0">paused at ${took(d.sec)}</div>`:''}`:''}</td></tr>`};
    const givenRow=d=>{const p=P[d.who];return `<tr><td class="wrap">${d.t}${d.msn?`<div class="hint" style="margin:0">${d.msn}</div>`:''}</td><td><span class="row" style="gap:6px">${avatar(d.who,'sm')}${p.f}</span></td><td style="color:var(--muted)">${fmtL(d.doneAt)}<div class="hint" style="margin:0">took ${took(d.sec)}</div></td><td class="wrap" style="color:var(--body)">${d.note?esc(d.note):'<span style="color:var(--muted)">—</span>'}</td><td class="wrap" colspan="2">${d.fb||'<span style="color:var(--muted)">—</span>'}</td><td>${d.medium}${d.fblink?` · <a href="${d.fblink.startsWith('http')?d.fblink:'https://'+d.fblink}" target="_blank">link</a>`:''}</td></tr>`};
    const sentRow=d=>{const to=d.to||'subah';const st=d.st==='given'?`<span class="pill p-ok">Feedback received ${fmtS(d.doneAt)}</span>`:timeLeft(d).h;return `<tr><td title="${esc(d.t)}">${d.t}${d.msn?`<div class="hint" style="margin:0">${d.msn}</div>`:''}</td><td><span class="row" style="gap:6px">${avatar(to,'sm')}${P[to].f}</span></td><td style="color:var(--muted)">${fmtAt(d.at)}</td><td>${link(d)}</td><td><span class="need ${NEED[d.need][1]}">${NEED[d.need][0]}</span></td><td colspan="2" class="wrap">${st}${d.st==='given'&&d.fb?`<div class="hint" style="margin:2px 0 0;white-space:normal">${esc(d.fb)}</div>`:''}</td></tr>`};
    const open=desk.filter(d=>d.st==='new'&&toOwner(d)&&match(d)).sort((x,y)=>timeLeft(x).o-timeLeft(y).o||x.at.localeCompare(y.at));
    const given=desk.filter(d=>d.st==='given'&&toOwner(d)&&match(d)).sort((x,y)=>y.doneAt.localeCompare(x.doneAt));
    const sent=desk.filter(d=>d.who===owner&&match(d)).sort((x,y)=>y.at.localeCompare(x.at));
    const table=(rows,head)=>`<div class="card" style="padding:0;overflow:hidden"><table class="desk">${cols}<tr>${head}</tr>${rows}</table></div>`;
    const byType=(list,row,head)=>[...TYPES,...[...new Set(list.map(d=>d.cat))].filter(c3=>!TYPES.includes(c3))].map(c2=>{const rows=list.filter(d=>d.cat===c2);if(!rows.length)return '';return `<div class="catsec"><h3>${c2} <span>${rows.length}</span></h3>${table(rows.map(row).join(''),head)}</div>`}).join('');
    $('#pageTitle').textContent=owner===me?'Feedback desk':`${P[owner].f}'s feedback desk`;
    $('#content').innerHTML=`${owner!==me?`<div class="row" style="margin-bottom:10px"><button class="lnk" id="backMine">← Back to ${P[owner].f}'s board</button><span class="hint">Viewing ${P[owner].f}'s desk to see their workload. In the real build only ${P[owner].f} marks things done here.</span></div>`:''}
      <div class="dseg"><button class="${deskPage==='new'?'on':''}" data-dp="new">Requests to ${owner===me?'me':P[owner].f}${open.length?` · ${open.length}`:''}</button><button class="${deskPage==='given'?'on':''}" data-dp="given">Feedback given</button><button class="${deskPage==='sent'?'on':''}" data-dp="sent">Requests ${owner===me?"I've":P[owner].f+' has'} sent</button></div>
      <div class="row" style="margin-bottom:14px;flex-wrap:wrap;gap:12px"><div class="dsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="dsearch" placeholder="Search" value="${esc(deskSearch)}"></div>${owner===me?`<button class="secb smb" id="newReq">+ New request to someone</button>`:''}${deskPage==='new'?'<span class="hint">Open a link and the clock starts. Not now pauses it. Mark done stops it.</span>':''}</div>
      ${deskPage==='new'?(byType(open,newRow,'<th>Request</th><th>From</th><th>Submitted</th><th>Link</th><th>Notes from them</th><th>Time left</th><th></th>')||'<div class="card"><div class="empty">Nothing waiting.</div></div>')
      :deskPage==='given'?(byType(given,givenRow,'<th>Request</th><th>From</th><th>Given on</th><th>Notes from them</th><th colspan="2">My feedback</th><th>Where</th>')||'<div class="card"><div class="empty">None yet.</div></div>')
      :(sent.length?table(sent.map(sentRow).join(''),'<th>Request</th><th>To</th><th>Sent</th><th>Link</th><th>Needed by</th><th colspan="2">Status</th>'):'<div class="card"><div class="empty">Nothing sent yet.</div></div>')}`;
    $('#content').querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{deskPage=b.dataset.dp;renderDesk()});
    const bm=$('#backMine');if(bm)bm.onclick=()=>{if(deskBack){selPerson=deskBack.person;btab=deskBack.tab;deskBack=null;deskOwner=me;view='boards';render()}else{deskOwner=me;renderDesk()}};
    const si=$('#dsearch');si.oninput=()=>{deskSearch=si.value;const pos=si.selectionStart;renderDesk();const n=$('#dsearch');n.focus();n.setSelectionRange(pos,pos)};
    const nr=$('#newReq');if(nr)nr.onclick=()=>{dialog({title:'New request',sub:'For work you want feedback on from someone, outside a board card. It lands on their desk; you track it under Requests I\'ve sent.',body:`<div class="fg"><label class="lb">To</label><div class="chips" id="nrW">${everyone().map(k=>`<span class="chip" data-k="${k}">${avatar(k)}${P[k].f}</span>`).join('')}</div></div><div class="fg"><label class="lb">What</label><input class="inp" id="nrT" placeholder="e.g. Calcium script, draft 2"></div><div class="fg"><label class="lb">Link</label><input class="inp" id="nrL" placeholder="https://"></div><div class="row" style="gap:8px"><div class="fg grow"><label class="lb">Category</label><select class="inp" id="nrC">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fg grow"><label class="lb">Needed by</label><select class="inp" id="nrN">${NEEDOPTS}</select></div></div>`,ok:'Send',onOk:()=>{const on=$('#nrW .on');const t=$('#nrT').value.trim();if(!on||!t)return false;desk.unshift({id:++seq,t,who:me,to:on.dataset.k,cat:$('#nrC').value,at:TI+'T'+nowT(),links:[$('#nrL').value.trim()||'https://example.com/work'],note:'',need:$('#nrN').value,st:'new',sec:0,run:false,tid:null,msn:null,fresh:true});notify(on.dataset.k,`Subah sent you a request: ${t}`);deskPage='sent';render()}});singleChips('#nrW')};
    $('#content').querySelectorAll('[data-link]').forEach(a2=>a2.onclick=()=>{const d=desk.find(x=>x.id===Number(a2.dataset.link));if(d&&d.st==='new'&&!d.run&&owner===me&&deskPage==='new'){d.run=true;d.fresh=false;startTick();toast('Clock started. Press Not now if you are coming back later.');setTimeout(renderDesk,50)}});
    $('#content').querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>{const d=desk.find(x=>x.id===Number(b.dataset.pause));d.run=false;renderDesk()});
    $('#content').querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>openDone(Number(b.dataset.done)));
  }
  function openDone(id){
    const d=desk.find(x=>x.id===id);d.run=false;let med=d._med||'Loom';let sec=d.sec||0;let fbText=d._fb||'',link=d._link||'';
    const draw=()=>{dialog({title:`Feedback done: ${d.t}`,body:`<div style="padding-bottom:16px;border-bottom:0.5px solid var(--line2)"><label class="lb">Time it took</label><div class="took">${sec?took(sec):'Not logged'}</div><div class="quick"><span class="hint" style="margin:0">Tap to correct:</span>${[5,10,20,30].map(m=>`<button data-q="${m}" class="${sec===m*60?'on':''}">${m} min</button>`).join('')}<button data-q="other">Other…</button></div></div>
        <div style="padding:16px 0;border-bottom:0.5px solid var(--line2)"><label class="lb">Your feedback in writing (optional)</label><textarea class="inp" id="fbT" placeholder="A line or two" style="min-height:90px">${esc(fbText)}</textarea></div>
        <div style="padding-top:16px"><label class="lb">Where you left it</label><div class="mediums">${MEDIUMS.map(m=>`<button data-med="${m}" class="${med===m?'on':''}">${m}</button>`).join('')}</div><input class="inp" id="fbL" placeholder="Link, if there is one (Loom, Frame, Canva comment)" value="${esc(link)}"></div>`,ok:'Mark done',onOk:()=>{d.st='given';d.sec=sec||300;d.fb=$('#fbT').value.trim();d.medium=med;d.fblink=$('#fbL').value.trim();d.doneAt=TI;const t=tasks.find(x=>x.id===d.tid);if(t){const m=t.ms.find(x=>x.n===d.msn&&x.fb==='wait')||t.ms.find(x=>x.fb==='wait');if(m){m.fb='got';m.at=TI}}notify(d.who,`${P[d.to||'subah'].f} gave feedback on ${d.t}`);toast(`${P[d.who].f} has been told. Took ${took(d.sec)}.`);render()}});
      const keep=()=>{fbText=$('#fbT').value;link=$('#fbL').value};
      $('#dbody').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{keep();if(b.dataset.q==='other'){dialog({title:'How long did it take?',body:'<input class="inp" id="mins" type="number" placeholder="Minutes">',ok:'Set',onOk:()=>{sec=(Number($('#mins').value)||0)*60;draw()}})}else{sec=Number(b.dataset.q)*60;draw()}});
      $('#dbody').querySelectorAll('[data-med]').forEach(b=>b.onclick=()=>{keep();med=b.dataset.med;draw()});
    };draw();
  }

  // ---------- dialogs ----------
  const closeModal=()=>{$('#modalRoot').innerHTML=''};
  function dialog({title,sub,body,ok='Save',cancel='Cancel',wide,onOk,danger}){
    $('#modalRoot').innerHTML=`<div class="mbg" id="mbg"><div class="modal ${wide?'wide':''}"><h3>${title}</h3>${sub?`<div class="ms">${sub}</div>`:''}<div id="dbody">${body}</div><div class="macts"><span></span><div style="display:flex;gap:8px"><button class="secb" id="dCancel">${cancel}</button>${ok?`<button class="${danger?'secb':'pri'}" id="dOk" ${danger?'style="color:var(--rose-ink);border-color:#E3C4A9"':''}>${ok}</button>`:''}</div></div></div></div>`;
    $('#dCancel').onclick=closeModal;$('#mbg').onclick=e=>{if(e.target.id==='mbg')closeModal()};
    const o=$('#dOk');if(o)o.onclick=()=>{const bodyEl=$('#dbody');if(onOk()!==false&&$('#dbody')===bodyEl)closeModal()};
    const f=$('#dbody input:not([type=date]):not([type=time]):not([type=number]),#dbody textarea');if(f)setTimeout(()=>f.focus(),30);
    $('#dbody').querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const o2=$('#dOk');if(o2)o2.click()}}));
  }
  const askText=(title,ph,cb,sub)=>dialog({title,sub,body:`<input class="inp" id="dIn" placeholder="${ph}">`,ok:'Add',onOk:()=>{const v=$('#dIn').value.trim();if(!v)return false;cb(v)}});
  const singleChips=id=>$(id).querySelectorAll('.chip').forEach(c2=>c2.onclick=()=>{$(id).querySelectorAll('.on').forEach(x=>x.classList.remove('on'));c2.classList.add('on')});

  const PKEY='satvic-workspace-proto-v1';
  const stateObj=()=>({projects,tasks,SYNCS,EVENTS,CATS,LABELS,desk,NOTIFS,honest,visits,notes,GROUPS,archived,FREEL,scopeBy,seq,TYPECOL});
  function persist(){try{localStorage.setItem(PKEY,JSON.stringify(stateObj()))}catch(e){}}
  function restore(){try{const raw=localStorage.getItem(PKEY);if(!raw)return;const o=JSON.parse(raw);if(!o||!o.projects||!o.tasks)return;if(o.TYPECOL)TYPECOL=Object.assign(TYPECOL,o.TYPECOL);projects=o.projects;tasks=o.tasks;SYNCS=o.SYNCS||SYNCS;EVENTS=o.EVENTS||EVENTS;CATS=o.CATS||CATS;LABELS=o.LABELS||LABELS;desk=o.desk||desk;NOTIFS=o.NOTIFS||NOTIFS;honest=o.honest||honest;visits=o.visits||visits;notes=o.notes||notes;GROUPS=o.GROUPS||GROUPS;archived=(o.archived||[]).map(a=>{const live2=a.kind==='card'?tasks.find(x=>x.id===a.obj.id):a.kind==='project'?null:projects.find(x=>x.id===a.obj.id);return live2?{...a,obj:live2}:a});FREEL=o.FREEL||FREEL;scopeBy=o.scopeBy||scopeBy;if(o.seq>seq)seq=o.seq;desk.forEach(dd=>{dd.run=false})}catch(e){}}
  (function shiftSample(){const n=daysBetween('2026-10-07',addDays(WK,2));if(!n)return;const re=/^(\d{4}-\d{2}-\d{2})(.*)$/;const walk=o=>{if(Array.isArray(o)){o.forEach((v,i)=>{if(typeof v==='string'){const m=v.match(re);if(m)o[i]=addDays(m[1],n)+m[2]}else if(v&&typeof v==='object')walk(v)})}else if(o&&typeof o==='object'){Object.keys(o).forEach(key=>{const v=o[key];if(typeof v==='string'){const m=v.match(re);if(m)o[key]=addDays(m[1],n)+m[2]}else if(v&&typeof v==='object')walk(v)})}};[projects,tasks,SYNCS,EVENTS,notes,LABELS,honest,visits,desk,NOTIFS,archived,leave,GROUPS].forEach(walk)})();
  restore();
  function render(){renderNav();closePop();if(view==='boards')renderBoards();else renderDesk();persist();const pg=$('.page');if(pg&&!$('#resetProto')){const r=document.createElement('div');r.innerHTML='<div style="text-align:center;margin-top:30px"><button class="lnk" id="resetProto" style="color:var(--muted);font-size:11.5px">Reset sample data</button></div>';pg.appendChild(r);$('#resetProto').onclick=()=>{if(confirm('Throw away your changes and go back to the sample data?')){localStorage.removeItem(PKEY);location.reload()}}}}
  render();
})();

</script>
</body>
</html>
